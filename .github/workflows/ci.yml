name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libfreetype-dev \
            libflac-dev \
            libvorbis-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \

      - name: Install toolchain
        run: |
          sudo apt-get install -y \
            clang \
            clang-format \
            lld \
            ninja-build \
            gcc-16 \
            g++-16

      - name: Install libstdc++ 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libstdc++-15-dev

      - name: Configure CMake
        run: cmake --preset=gcc-ninja-lld -DFETCH_ASSETS=OFF

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure