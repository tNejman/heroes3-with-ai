name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libfreetype-dev \
            libflac-dev \
            libvorbis-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            clang \
            lld \
            ninja-build \
            clang-format

      - name: Install libstdc++ 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libstdc++-15-dev

      - name: Configure CMake
        run: cmake --preset=clang-ninja-lld

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Check formatting
        run: |
          files=$(mktemp)
          find include -type f \( -name '*.h' -o -name '*.hpp' \) -print0 >  "$files"
          find src     -type f -name '*.cc'                       -print0 >> "$files"
          xargs -0 clang-format --dry-run --Werror < "$files"