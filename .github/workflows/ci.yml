name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libfreetype-dev \
            libflac-dev \
            libvorbis-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            clang \
            clang-format \
            lld \
            ninja-build \

      - name: Install libstdc++ 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libstdc++-15-dev

      - name: Configure CMake
        run: cmake --preset=clang-ninja-lld

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Format with clang-format
        run: |
          find include -type f \( -name '*.h' -o -name '*.hpp' \) -exec clang-format -i {} +
          find src -type f -name '*.cc' -exec clang-format -i {} +
          echo "### Files reformatted" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"